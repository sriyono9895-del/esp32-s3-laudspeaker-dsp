# ESP32-S3 Laudspeaker Management System

Project starter digital loudspeaker management system berbasis ESP32-S3 untuk kontrol audio profesional.

Fitur yang sudah disiapkan:

- 10-band equalizer
- crossover 3-way (low / mid / high)
- pengaturan gain master dan per channel
- menu serial untuk debug dan tuning
- struktur DSP yang bisa dikembangkan ke display TFT/GUI

## Struktur utama

- `src/main.cpp` : menu kontrol dan test console
- `src/audio/AudioDSP.h` : deklarasi DSP manager
- `src/audio/AudioDSP.cpp` : implementasi EQ, crossover, gain

## Hardware target

- ESP32-S3
- I2S DAC / audio output
- power amplifier 3 channel
- optional display TFT 320x240 untuk UI

## Build

Gunakan PlatformIO:

1. Buka project di VS Code
2. Install PlatformIO
3. Jalankan `Build`
4. Upload ke ESP32-S3
5. Buka serial monitor 115200

## Menu serial

- `1` = lihat EQ
- `2` = set band EQ
- `3` = lihat crossover
- `4` = set crossover
- `5` = lihat gain
- `6` = set gain
- `7` = test signal
- `8` = reset profile default
- `9` = tampilkan ringkasan DSP
- `0` = tampilkan menu

## Catatan

Versi ini adalah starter firmware siap dikembangkan ke audio DSP real-time yang lebih presisi dengan filter IIR, display, dan penyimpanan preset ke flash.

